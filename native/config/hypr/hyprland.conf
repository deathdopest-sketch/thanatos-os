monitor=,preferred,auto,1

$terminal = foot
$menu = wofi --show drun
$browser = chromium
$mod = SUPER

exec-once = waybar
exec-once = hyprpaper
exec-once = mako
exec-once = systemctl --user start thanatos-web.service
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP

env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24

general {
  gaps_in = 5
  gaps_out = 12
  border_size = 2
  # Lilly palette: pink -> violet
  col.active_border = rgba(ff75ceee) rgba(a56bffee) 45deg
  col.inactive_border = rgba(24102faa)
  layout = dwindle
}

decoration {
  rounding = 6
  active_opacity = 0.96
  inactive_opacity = 0.88
  blur {
    enabled = true
    size = 8
    passes = 3
    new_optimizations = true
  }
  shadow {
    enabled = true
    range = 24
    render_power = 3
    color = rgba(00000099)
  }
}

animations {
  enabled = true
  bezier = thanatos, 0.16, 1, 0.3, 1
  animation = windows, 1, 5, thanatos, slide
  animation = border, 1, 8, thanatos
  animation = fade, 1, 5, thanatos
  animation = workspaces, 1, 5, thanatos, slidevert
}

dwindle {
  pseudotile = true
  preserve_split = true
}

misc {
  disable_hyprland_logo = true
  disable_splash_rendering = true
  vfr = true
}

bind = $mod, Return, exec, $terminal
bind = $mod, D, exec, $menu
bind = $mod, B, exec, $browser
# Lilly desktop as a fullscreen app window
bind = $mod, T, exec, $browser --app=http://localhost:4173 --start-fullscreen
# Dev session: tmux in a terminal
bind = $mod SHIFT, Return, exec, $terminal -e tmux new -A -s thanatos
bind = $mod, Q, killactive
bind = $mod, F, fullscreen
bind = $mod SHIFT, Space, togglefloating
bind = $mod SHIFT, E, exit

bind = $mod, H, movefocus, l
bind = $mod, L, movefocus, r
bind = $mod, K, movefocus, u
bind = $mod, J, movefocus, d

bind = $mod SHIFT, H, movewindow, l
bind = $mod SHIFT, L, movewindow, r
bind = $mod SHIFT, K, movewindow, u
bind = $mod SHIFT, J, movewindow, d

bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4

bind = , Print, exec, grim -g "$(slurp)" "$HOME/Pictures/thanatos-$(date +%Y%m%d-%H%M%S).png"

bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow

windowrulev2 = opacity 0.92 0.86,class:^(foot)$
windowrulev2 = float,title:^(Picture-in-Picture)$
