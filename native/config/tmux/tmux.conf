# Thanatos tmux: prefix is Ctrl-a, vim-style panes, Lilly palette.
set -g prefix C-a
unbind C-b
bind C-a send-prefix

set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 50000
set -g escape-time 10
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"
setw -g mode-keys vi

bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind r source-file ~/.tmux.conf \; display "reloaded"

set -g status-style "bg=#050508,fg=#eef8f2"
set -g status-left "#[bg=#ff75ce,fg=#050508,bold] ☠ #S #[default] "
set -g status-right "#[fg=#a56bff]%a %d %b #[fg=#ff75ce,bold]%H:%M "
setw -g window-status-format " #I:#W "
setw -g window-status-current-format "#[bg=#24102f,fg=#ff75ce,bold] #I:#W "
set -g pane-border-style "fg=#24102f"
set -g pane-active-border-style "fg=#ff75ce"
set -g message-style "bg=#24102f,fg=#ff75ce"
